[env:m5stack-cardputer]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    # CORE_DEBUG_LEVEL controls Arduino-core logging. NimBLE-Arduino
    # routes through the same channel, so dropping from 3 (INFO) to 2
    # (WARN) silences the per-advert "Updated advertiser" spam without
    # hiding real warnings/errors. Our own printf "[mesh]" /
    # "[ble_client]" / "[filestore]" lines bypass this.
    -DCORE_DEBUG_LEVEL=2
    -I${PROJECT_DIR}/..
    -DCONFIG_BT_NIMBLE_TASK_STACK_SIZE=8192

# Pull in shared core sources from firmware/core/. Paths are relative to
# the default src_dir (firmware/cardputer/src/), so ../../core/foo.c
# resolves to firmware/core/foo.c. Identity / peer_table / peer_sync /
# mesh_state aren't built yet — they need the crypto HAL (step 3) and
# the BLE-client mesh driver (later step).
build_src_filter =
    +<*>
    +<../../core/commands.c>
    +<../../core/attest_cache.c>
    +<../../core/attest_query.c>
    +<../../core/attestations.c>
    +<../../core/cborencode.c>
    +<../../core/cbor_decode.c>
    +<../../core/encounter_record.c>
    +<../../core/encounters.c>
    +<../../core/manifest_counter.c>
    +<../../core/identity.c>
    +<../../core/peer_sync.c>
    +<../../core/peer_table.c>
    +<../../core/mesh_state.c>
    +<../../core/ssid_scan.c>
    +<../../core/thirdparty/monocypher/monocypher.c>
    +<../../core/thirdparty/monocypher/monocypher-ed25519.c>
    +<../../core/thirdparty/sha256/sha256.c>

lib_deps =
    m5stack/M5Cardputer@^1.0.3
    h2zero/NimBLE-Arduino@^2.0
